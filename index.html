<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0e0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PDF Okuyucu" />
  <link rel="manifest" href="./manifest.json" />
  <title>PDF Okuyucu</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a96e;
      --gold-light: #e8c98a;
      --bg: #0e0f13;
      --bg2: #161820;
      --border: rgba(255,255,255,0.07);
      --text: #e8e4dc;
      --muted: #6b7280;
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none; }

    /* ── LAYOUT ── */
    .app { height: 100%; display: flex; flex-direction: column; background: radial-gradient(ellipse at 20% 0%, #1a1530 0%, var(--bg) 60%); }

    /* ── HEADER ── */
    .header {
      padding: calc(12px + var(--safe-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      background: rgba(14,15,19,0.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0; z-index: 50;
    }
    .header-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .header-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: #f0ead8; flex: 1; }
    .header-btns { display: flex; gap: 8px; }
    .icon-btn { width: 34px; height: 34px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .api-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .api-dot.ok { background: #22c55e; }

    /* ── API DRAWER ── */
    .api-drawer {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 14px 16px; flex-shrink: 0;
      animation: slideDown 0.2s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .api-row { display: flex; gap: 8px; align-items: center; }
    .api-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 9px; padding: 10px 13px; color: var(--text); font-size: 13px; outline: none; font-family: monospace; }
    .api-input:focus { border-color: rgba(201,169,110,0.5); }
    .api-save { padding: 10px 16px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; border-radius: 9px; color: #1a1208; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .api-hint { font-size: 11px; color: #4b5563; margin-top: 8px; }
    .api-hint a { color: var(--gold); }

    /* ── TABS ── */
    .tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg2); }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; font-weight: 500; letter-spacing: 0.02em; }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(201,169,110,0.04); }

    /* ── UPLOAD PANEL ── */
    .upload-panel { flex: 1; overflow-y: auto; padding: 20px 16px; }
    .upload-area { border: 1.5px dashed rgba(201,169,110,0.35); border-radius: 14px; padding: 32px 16px; text-align: center; cursor: pointer; position: relative; background: rgba(201,169,110,0.02); transition: all 0.2s; margin-bottom: 16px; }
    .upload-area.drag-over { border-color: var(--gold); background: rgba(201,169,110,0.07); }
    .upload-area input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .upload-emoji { font-size: 40px; margin-bottom: 10px; }
    .upload-text { font-size: 15px; color: var(--gold); font-weight: 500; }
    .upload-hint { font-size: 12px; color: #4b5563; margin-top: 4px; }

    .file-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: rgba(201,169,110,0.07); border: 1px solid rgba(201,169,110,0.2); border-radius: 12px; margin-bottom: 20px; }
    .file-emoji { font-size: 28px; }
    .file-name { font-size: 13px; font-weight: 500; color: var(--gold-light); }
    .file-size { font-size: 11px; color: var(--muted); }

    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .quick-btn { padding: 12px 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; color: #b8b2a7; font-size: 12px; cursor: pointer; text-align: center; transition: all 0.2s; font-family: 'DM Sans', sans-serif; line-height: 1.4; }
    .quick-btn:active:not(:disabled) { background: rgba(201,169,110,0.1); border-color: rgba(201,169,110,0.3); transform: scale(0.97); }
    .quick-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .quick-btn .qicon { font-size: 18px; display: block; margin-bottom: 4px; }

    /* ── CHAT PANEL ── */
    .chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 32px 24px; gap: 10px; }
    .empty-state .ei { font-size: 44px; opacity: 0.5; }
    .empty-state .et { font-family: 'Playfair Display', serif; font-size: 18px; color: #6b7280; }
    .empty-state .ed { font-size: 13px; color: #374151; line-height: 1.6; max-width: 260px; }

    .message { display: flex; gap: 9px; animation: fadeUp 0.25s ease; }
    .message.user { flex-direction: row-reverse; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .avatar { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; }
    .avatar.ai { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #1a1208; }
    .avatar.user { background: rgba(255,255,255,0.08); }
    .bubble { max-width: 80%; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
    .message.ai .bubble { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-top-left-radius: 3px; color: #ddd8ce; }
    .message.user .bubble { background: rgba(201,169,110,0.12); border: 1px solid rgba(201,169,110,0.22); border-top-right-radius: 3px; color: #f0ead8; }

    .dots { display: flex; gap: 4px; padding: 3px 0; }
    .dot { width: 5px; height: 5px; background: var(--gold); border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-5px);opacity:1} }

    /* ── INPUT ── */
    .input-area {
      padding: 10px 12px calc(10px + var(--safe-bot));
      border-top: 1px solid var(--border);
      background: rgba(14,15,19,0.95);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 9px; align-items: flex-end; }
    .input-field { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 22px; padding: 11px 16px; color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif; resize: none; outline: none; line-height: 1.4; max-height: 100px; transition: border-color 0.2s; }
    .input-field:focus { border-color: rgba(201,169,110,0.4); }
    .input-field::placeholder { color: #4b5563; }
    .send-btn { width: 44px; height: 44px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; border-radius: 50%; color: #1a1208; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
    .send-btn:active:not(:disabled) { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── INSTALL BANNER ── */
    .install-banner {
      margin: 12px 16px 0;
      padding: 12px 14px;
      background: rgba(201,169,110,0.08);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 12px;
      display: flex; align-items: center; gap: 10px;
      animation: fadeUp 0.4s ease;
    }
    .install-banner .ib-text { flex: 1; font-size: 12.5px; color: #c9a96e; line-height: 1.4; }
    .install-btn { padding: 8px 14px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; border-radius: 8px; color: #1a1208; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .dismiss-btn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    function App() {
      const [apiKey, setApiKey]     = useState(() => localStorage.getItem("pdf_api_key") || "");
      const [apiInput, setApiInput] = useState("");
      const [showApi, setShowApi]   = useState(false);
      const [pdfData, setPdfData]   = useState(null);
      const [fileName, setFileName] = useState("");
      const [fileSize, setFileSize] = useState("");
      const [messages, setMessages] = useState([]);
      const [input, setInput]       = useState("");
      const [loading, setLoading]   = useState(false);
      const [dragOver, setDragOver] = useState(false);
      const [tab, setTab]           = useState("upload"); // "upload" | "chat"
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstall, setShowInstall] = useState(false);
      const messagesEndRef = useRef(null);

      // PWA install prompt
      useEffect(() => {
        const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); };
        window.addEventListener("beforeinstallprompt", handler);
        return () => window.removeEventListener("beforeinstallprompt", handler);
      }, []);

      // Service Worker kayıt
      useEffect(() => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        }
      }, []);

      const installApp = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        setShowInstall(false);
        setDeferredPrompt(null);
      };

      const formatSize = (b) => b < 1048576 ? (b/1024).toFixed(1)+" KB" : (b/1048576).toFixed(1)+" MB";

      const saveApiKey = () => {
        const k = apiInput.trim();
        if (!k) return;
        localStorage.setItem("pdf_api_key", k);
        setApiKey(k); setApiInput(""); setShowApi(false);
      };

      const handleFile = useCallback((file) => {
        if (!file || file.type !== "application/pdf") return;
        const reader = new FileReader();
        reader.onload = (e) => {
          setPdfData(e.target.result.split(",")[1]);
          setFileName(file.name);
          setFileSize(formatSize(file.size));
          setMessages([]);
          setTab("chat");
        };
        reader.readAsDataURL(file);
      }, []);

      const sendMessage = async (text) => {
        if (!text.trim() || !pdfData || loading || !apiKey) return;
        const userMsg = { role: "user", content: text };
        const newMsgs = [...messages, userMsg];
        setMessages(newMsgs); setInput(""); setLoading(true);
        setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);

        try {
          const apiMessages = newMsgs.map((m, i) => {
            if (m.role === "user" && i === 0) return {
              role: "user",
              content: [
                { type: "document", source: { type: "base64", media_type: "application/pdf", data: pdfData } },
                { type: "text", text: m.content }
              ]
            };
            return { role: m.role, content: m.content };
          });

          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1500,
              system: "Sen yardımsever bir PDF asistanısın. Türkçe veya kullanıcının dilinde kısa ve net cevaplar ver.",
              messages: apiMessages
            })
          });

          if (res.status === 401) throw new Error("401");
          const data = await res.json();
          const aiText = data.content?.map(b => b.text||"").join("") || "Yanıt alınamadı.";
          setMessages(prev => [...prev, { role: "assistant", content: aiText }]);
        } catch(err) {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: err.message === "401" ? "⚠️ API anahtarı geçersiz." : "⚠️ Bağlantı hatası."
          }]);
        } finally {
          setLoading(false);
          setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
        }
      };

      const quickAsk = (q) => { sendMessage(q); };
      const canSend = !!pdfData && !!apiKey && !loading;

      const quickButtons = [
        ["📋","Özetle"],["🔑","Ana konular"],
        ["📊","Verileri analiz et"],["❓","Önemli noktalar"],
        ["📝","Sonuçlar"],["🌍","Belgenin amacı"]
      ];

      return (
        <div className="app">
          {/* HEADER */}
          <header className="header">
            <div className="header-icon">📄</div>
            <div className="header-title">PDF Okuyucu</div>
            <div className="header-btns">
              <div className={`api-dot ${apiKey ? "ok" : ""}`} style={{alignSelf:"center",marginRight:4}} />
              <div className="icon-btn" onClick={() => setShowApi(v=>!v)}>⚙️</div>
            </div>
          </header>

          {/* INSTALL BANNER */}
          {showInstall && (
            <div className="install-banner">
              <span style={{fontSize:22}}>📲</span>
              <div className="ib-text">Uygulamayı ana ekrana ekle, tarayıcı açmadan kullan!</div>
              <button className="install-btn" onClick={installApp}>Yükle</button>
              <button className="dismiss-btn" onClick={() => setShowInstall(false)}>×</button>
            </div>
          )}

          {/* API DRAWER */}
          {showApi && (
            <div className="api-drawer">
              <div className="api-row">
                <input className="api-input" type="password" placeholder="sk-ant-..." value={apiInput}
                  onChange={e=>setApiInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveApiKey()} />
                <button className="api-save" onClick={saveApiKey}>Kaydet</button>
                {apiKey && <button onClick={()=>{localStorage.removeItem("pdf_api_key");setApiKey("");}}
                  style={{padding:"10px 12px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:"9px",color:"#f87171",cursor:"pointer"}}>Sil</button>}
              </div>
              <div className="api-hint">Anahtar telefonunuza kaydedilir. Almak için: <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></div>
            </div>
          )}

          {/* TABS */}
          <div className="tabs">
            <div className={`tab ${tab==="upload"?"active":""}`} onClick={()=>setTab("upload")}>📂 PDF & Sorular</div>
            <div className={`tab ${tab==="chat"?"active":""}`} onClick={()=>setTab("chat")}>
              💬 Sohbet {messages.length>0 && <span style={{marginLeft:4,background:"rgba(201,169,110,0.3)",padding:"1px 6px",borderRadius:10,fontSize:10}}>{messages.length}</span>}
            </div>
          </div>

          {/* UPLOAD TAB */}
          {tab === "upload" && (
            <div className="upload-panel">
              <div className={`upload-area ${dragOver?"drag-over":""}`}
                onDragOver={e=>{e.preventDefault();setDragOver(true)}}
                onDragLeave={()=>setDragOver(false)}
                onDrop={e=>{e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0])}}>
                <input type="file" accept=".pdf" onChange={e=>handleFile(e.target.files[0])} />
                <div className="upload-emoji">📂</div>
                <div className="upload-text">PDF seç veya sürükle</div>
                <div className="upload-hint">Sadece .pdf formatı</div>
              </div>

              {fileName && (
                <div className="file-card">
                  <span className="file-emoji">📑</span>
                  <div>
                    <div className="file-name" style={{fontSize:13,fontWeight:500,color:"#e8c98a"}}>{fileName}</div>
                    <div className="file-size">{fileSize}</div>
                  </div>
                </div>
              )}

              <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",color:"#6b7280",marginBottom:10,fontWeight:500}}>
                Hızlı Sorular
              </div>
              <div className="quick-grid">
                {quickButtons.map(([icon, q]) => (
                  <button key={q} className="quick-btn" onClick={()=>{quickAsk(q);setTab("chat");}} disabled={!canSend}>
                    <span className="qicon">{icon}</span>{q}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* CHAT TAB */}
          {tab === "chat" && (
            <div className="chat-panel">
              <div className="messages">
                {messages.length === 0 ? (
                  <div className="empty-state">
                    <div className="ei">{!apiKey?"🔑":!pdfData?"📄":"💬"}</div>
                    <div className="et">{!apiKey?"API Gerekli":!pdfData?"PDF Yükle":"Sorunuzu yazın"}</div>
                    <div className="ed">
                      {!apiKey?"⚙️ butonundan API anahtarınızı girin."
                      :!pdfData?"PDF & Sorular sekmesinden bir PDF yükleyin."
                      :`"${fileName}" hazır. Bir şeyler sorun!`}
                    </div>
                  </div>
                ) : messages.map((msg,i) => (
                  <div key={i} className={`message ${msg.role==="user"?"user":"ai"}`}>
                    <div className={`avatar ${msg.role==="user"?"user":"ai"}`}>{msg.role==="user"?"👤":"✨"}</div>
                    <div className="bubble">{msg.content}</div>
                  </div>
                ))}
                {loading && (
                  <div className="message ai">
                    <div className="avatar ai">✨</div>
                    <div className="bubble"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div></div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              <div className="input-area">
                <div className="input-row">
                  <textarea className="input-field" rows={1}
                    placeholder={!apiKey?"API ayarlayın...":!pdfData?"PDF yükleyin...":"Sorunuzu yazın..."}
                    value={input} onChange={e=>setInput(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage(input);}}}
                    disabled={!canSend} />
                  <button className="send-btn" onClick={()=>sendMessage(input)} disabled={!canSend||!input.trim()}>➤</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
